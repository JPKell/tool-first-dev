[project]
name = "project-dev-tools"
version = "0.2.0"
description = "Tool-First Development MCP server, Tree-sitter knowledge-graph indexer (with OpenWeightGym summaries/embeddings), and multi-agent hooks."
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0.0",
    "httpx>=0.27.0",
    "tree-sitter>=0.23.0",
    "tree-sitter-python>=0.23.0",
    "tree-sitter-javascript>=0.23.0",
    "ruff>=0.9.0",
    "pytest>=8.0.0",
]
